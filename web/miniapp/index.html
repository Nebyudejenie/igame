<!doctype html>
<html lang="am">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Zemen Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/screens.css" />
  <link rel="stylesheet" href="css/wallet.css" />
  <link rel="stylesheet" href="css/keno.css" />
  <!-- Inlined, not a linked stylesheet: this must paint on the very first
       frame, with zero chance of a flash of an unstyled logo while
       css/*.css is still in flight over a slow mobile connection --
       the whole point of a splash screen is that it's what appears
       BEFORE anything else can possibly be ready. -->
  <style>
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: radial-gradient(circle at 50% 42%, #4a1f7a 0%, #2a0f52 38%, #150726 72%, #0b0414 100%);
      overflow: hidden;
      transition: opacity 500ms ease, visibility 500ms ease;
    }
    #splash-screen.splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    /* Slow rotating light rays behind the logo, echoing the sunburst
       already painted into the logo artwork itself. */
    #splash-screen::before {
      content: "";
      position: absolute;
      inset: -50%;
      background: repeating-conic-gradient(from 0deg, rgba(255, 201, 74, 0.07) 0deg 8deg, transparent 8deg 20deg);
      animation: splash-rotate 18s linear infinite;
    }
    @keyframes splash-rotate {
      to { transform: rotate(360deg); }
    }
    .splash-logo-wrap {
      position: relative;
      width: clamp(160px, 46vw, 220px);
      aspect-ratio: 1;
      z-index: 1;
      animation: splash-pop 900ms cubic-bezier(0.22, 0.9, 0.32, 1.3) both,
                 splash-breathe 2600ms ease-in-out 900ms infinite;
    }
    .splash-logo-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      /* The source artwork is a fully opaque square (no alpha channel) --
         without this, its own flat background square shows as a visible
         hard-edged seam against the splash's own animated gradient
         behind it. Clipping to a circle also makes the drop-shadow glow
         below hug a circular halo instead of a square one. */
      clip-path: circle(50% at 50% 50%);
      filter: drop-shadow(0 8px 28px rgba(0, 0, 0, 0.55));
    }
    @keyframes splash-pop {
      0% { opacity: 0; transform: scale(0.55) rotate(-8deg); }
      60% { opacity: 1; transform: scale(1.08) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes splash-breathe {
      0%, 100% { filter: drop-shadow(0 8px 28px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 0 rgba(255, 201, 74, 0)); }
      50% { filter: drop-shadow(0 8px 28px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 34px rgba(255, 201, 74, 0.55)); }
    }
    .splash-sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #ffe27a;
      border-radius: 50%;
      box-shadow: 0 0 8px 2px rgba(255, 226, 122, 0.9);
      opacity: 0;
      animation: splash-twinkle 2200ms ease-in-out infinite;
    }
    .splash-sparkle:nth-child(2) { top: 10%; left: 14%; animation-delay: 300ms; }
    .splash-sparkle:nth-child(3) { top: 16%; right: 10%; animation-delay: 900ms; }
    .splash-sparkle:nth-child(4) { bottom: 16%; left: 10%; animation-delay: 1400ms; }
    .splash-sparkle:nth-child(5) { bottom: 24%; right: 12%; animation-delay: 600ms; }
    @keyframes splash-twinkle {
      0%, 100% { opacity: 0; transform: scale(0.4); }
      50% { opacity: 1; transform: scale(1); }
    }
    .splash-loader {
      display: flex;
      gap: 10px;
      z-index: 1;
      opacity: 0;
      animation: splash-fade-in 500ms ease 700ms forwards;
    }
    .splash-loader span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ffc94a;
      animation: splash-dot 1100ms ease-in-out infinite;
    }
    .splash-loader span:nth-child(2) { animation-delay: 150ms; }
    .splash-loader span:nth-child(3) { animation-delay: 300ms; }
    @keyframes splash-dot {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-6px); }
    }
    @keyframes splash-fade-in {
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash-screen::before,
      .splash-logo-wrap,
      .splash-sparkle,
      .splash-loader span {
        animation: none !important;
      }
      .splash-logo-wrap { opacity: 1; transform: none; }
      .splash-loader { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div class="splash-logo-wrap">
      <img src="assets/logo.png" alt="Zemen Game" />
      <span class="splash-sparkle"></span>
      <span class="splash-sparkle"></span>
      <span class="splash-sparkle"></span>
      <span class="splash-sparkle"></span>
    </div>
    <div class="splash-loader"><span></span><span></span><span></span></div>
  </div>
  <div id="connection-banner"></div>
  <div id="toast" class="toast"></div>

  <!-- 2.1 Room list -->
  <main id="screen-rooms" class="screen" data-screen="rooms">
    <div class="room-list-header">
      <div class="balance-pill">
        <span>💰</span>
        <span class="amount" id="balance-amount">-- ETB</span>
      </div>
      <div class="header-actions">
        <button id="invite-btn" class="wallet-fab invite-fab">
          <span aria-hidden="true">🎁</span>
          <span class="wallet-fab-label" data-i18n="invite.button"></span>
        </button>
        <button id="voice-settings-btn" class="icon-fab">🔊</button>
        <!-- Starts hidden -- shown only once checkKenoAvailability() (app.v6.js)
             confirms /api/keno/state doesn't 503. A deployment where Keno has
             never been configured (keno_configs has zero rows -- the real state
             of a fresh production deploy, see docs/keno/PROGRESS.md's own
             production gate) would otherwise let a player tap into a game
             center with no round/config data, refreshState() silently no-op'ing
             on the 503 and leaving a blank, un-explained screen behind. -->
        <button id="open-keno-btn" class="wallet-fab keno-fab hidden">
          <span aria-hidden="true">🎱</span>
          <span class="wallet-fab-label" data-i18n="keno.nav_button"></span>
        </button>
        <button id="open-wallet-btn" class="wallet-fab">
          <svg class="wallet-fab-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
            <path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M16 12.5h2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M3 9h18" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <span class="wallet-fab-label" data-i18n="wallet.title"></span>
        </button>
      </div>
    </div>
    <div class="rooms-activity-row">
      <span class="rooms-activity-pill">
        <span class="rooms-activity-dot online"></span>
        <span id="rooms-online-count">0</span>
        <span data-i18n="rooms.online_label"></span>
      </span>
      <span class="rooms-activity-pill">
        <span class="rooms-activity-dot playing"></span>
        <span id="rooms-playing-count">0</span>
        <span data-i18n="rooms.playing_count_label"></span>
      </span>
    </div>
    <div id="invite-panel" class="voice-settings-panel hidden">
      <p class="invite-panel-title" data-i18n="invite.panel_title"></p>
      <p id="invite-count" class="invite-count"></p>
      <button id="invite-share-btn" class="btn-secondary" data-i18n="invite.share_button"></button>
    </div>
    <div id="voice-settings-panel" class="voice-settings-panel hidden">
      <div class="voice-settings-row">
        <span data-i18n="voice.title"></span>
        <div id="voice-switch-settings" class="switch on"><div class="switch-knob"></div></div>
      </div>
      <div class="voice-settings-row">
        <span data-i18n="voice.volume"></span>
        <input id="voice-volume-slider" type="range" min="0" max="100" value="100" />
      </div>
      <div class="voice-settings-row">
        <span data-i18n="voice.speed"></span>
        <input id="voice-speed-slider" type="range" min="50" max="150" value="100" />
      </div>
      <button id="voice-replay-btn" class="btn-secondary" data-i18n="voice.replay"></button>
    </div>
    <div id="room-list"></div>
  </main>

  <!-- 2.2 Card selection (LOBBY) -->
  <main id="screen-lobby" class="screen" data-screen="lobby">
    <div class="lobby-topbar">
      <button id="lobby-refresh-btn" class="lobby-refresh-btn" type="button">
        <span class="lobby-refresh-icon">&#8635;</span>
        <span data-i18n="lobby.refresh"></span>
      </button>
      <div class="lobby-balance-pill">
        <span data-i18n="lobby.balance_label"></span>
        <span id="lobby-balance-amount">-- ETB</span>
      </div>
    </div>
    <div class="lobby-status-row">
      <div id="lobby-connection-pill" class="lobby-connection-pill">
        <span class="lobby-connection-dot"></span>
        <span id="lobby-connection-label"></span>
      </div>
      <span id="lobby-countdown" class="stat-value"></span>
      <div class="lobby-stake-pill">
        <span data-i18n="lobby.stake_label"></span>
        <span id="lobby-stake-amount">0.00 ETB</span>
      </div>
    </div>
    <div class="lobby-win-bar">
      <span data-i18n="lobby.win_label"></span>
      <span id="lobby-win-amount">0.00 ETB</span>
    </div>
    <div id="lobby-your-cards-section" class="your-card-section hidden">
      <div id="lobby-your-cards-list" class="your-cards-list"></div>
    </div>
    <div id="card-grid" class="card-grid"></div>
    <button id="lobby-cta" class="btn-primary" disabled></button>
  </main>

  <!-- 2.3 Game screen (RUNNING) + 2.4 Spectate -->
  <main id="screen-game" class="screen screen-game" data-screen="game">
    <div class="stat-strip">
      <div class="stat">
        <span class="stat-label" data-i18n="game.derash"></span>
        <span class="stat-value" id="stat-derash">0.00 ETB</span>
      </div>
      <div class="stat">
        <span class="stat-label" data-i18n="game.players"></span>
        <span class="stat-value" id="stat-players">0</span>
      </div>
      <div class="stat">
        <span class="stat-label" data-i18n="game.stake"></span>
        <span class="stat-value" id="stat-stake">0.00 ETB</span>
      </div>
      <div class="stat">
        <span class="stat-label" data-i18n="game.call"></span>
        <span class="stat-value" id="stat-call">0/75</span>
      </div>
    </div>

    <div id="spectate-banner" class="spectate-banner hidden">
      <p data-i18n="spectate.banner"></p>
      <div id="announcement-marquee" class="announcement-marquee hidden">
        <div class="announcement-marquee-track">
          <span id="announcement-marquee-text"></span>
          <span id="announcement-marquee-text-repeat" aria-hidden="true"></span>
        </div>
      </div>
    </div>

    <!-- Single-column-of-calls on the left, everything the player watches
         moment-to-moment stacked in the right column (recent trail, the
         current ball, AUTO/Voice, their own card, the Bingo button) --
         one flex row so the whole screen's height is bounded by the taller
         of the two columns, never by their sum. -->
    <div class="game-body">
      <div id="board"></div>
      <div class="call-panel">
        <div class="ball-row">
          <div class="recent-calls" id="recent-calls"></div>
          <div id="call-badge" class="call-badge"></div>
        </div>
        <div class="toggle-row">
          <div class="auto-toggle">
            <span data-i18n="game.auto"></span>
            <div id="auto-switch" class="switch on"><div class="switch-knob"></div></div>
          </div>
          <div class="auto-toggle">
            <span data-i18n="voice.title"></span>
            <div id="voice-switch" class="switch on"><div class="switch-knob"></div></div>
          </div>
        </div>
        <div id="your-card-section" class="your-card-section">
          <div id="your-cards-list" class="your-cards-list"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- 2.5 Result (SETTLING) -->
  <main id="screen-result" class="screen result-screen" data-screen="result">
    <div id="result-confetti" class="result-confetti" aria-hidden="true"></div>
    <div id="result-title" class="result-title"></div>
    <div id="result-winner-pill" class="winner-pill hidden"></div>
    <div id="result-amount" class="result-amount"></div>
    <div id="result-meta" class="result-meta"></div>
    <div id="result-card-panel" class="card-preview result-card-panel hidden">
      <div id="result-card"></div>
    </div>
    <div id="result-session" class="result-session"></div>
    <div class="result-actions">
      <button id="play-next-btn" class="btn-primary btn-gold" data-i18n="result.play_next"></button>
      <button id="verify-draw-btn" class="btn-secondary" data-i18n="result.verify_draw"></button>
    </div>
    <div id="result-autocontinue" class="result-autocontinue hidden">
      <div id="result-autocontinue-fill" class="result-autocontinue-fill"></div>
      <span id="result-autocontinue-label"></span>
    </div>
    <div id="fairness-panel" class="fairness-panel hidden">
      <div class="fairness-row">
        <span data-i18n="fairness.verified_label"></span>
        <span id="fairness-verified"></span>
      </div>
      <div class="fairness-row">
        <span data-i18n="fairness.seed_hash_label"></span>
        <span id="fairness-hash" class="fairness-value"></span>
      </div>
      <div class="fairness-row">
        <span data-i18n="fairness.seed_label"></span>
        <span id="fairness-seed" class="fairness-value"></span>
      </div>
      <p class="wallet-note" data-i18n="fairness.explainer"></p>
      <button id="fairness-close-btn" class="btn-secondary" data-i18n="fairness.close"></button>
    </div>
  </main>

  <!-- 2.6 Wallet -->
  <main id="screen-wallet" class="screen" data-screen="wallet">
    <div class="wallet-header">
      <h2 data-i18n="wallet.title"></h2>
      <button id="wallet-back-btn">✕</button>
    </div>
    <div class="wallet-tabs">
      <div class="wallet-tab active" data-tab="balance" data-i18n="wallet.tab_balance"></div>
      <div class="wallet-tab" data-tab="deposit" data-i18n="wallet.tab_deposit"></div>
      <div class="wallet-tab" data-tab="withdraw" data-i18n="wallet.tab_withdraw"></div>
      <div class="wallet-tab" data-tab="history" data-i18n="wallet.tab_history"></div>
    </div>

    <div id="wallet-pane-balance" class="wallet-pane">
      <div class="wallet-card balance-hero balance-hero-total">
        <div class="balance-icon">💰</div>
        <div class="balance-figures">
          <div class="balance-value" id="wallet-total">0.00 ETB</div>
          <div class="balance-label" data-i18n="wallet.total_balance"></div>
        </div>
      </div>
      <div class="wallet-card balance-hero balance-hero-available">
        <div class="balance-icon balance-icon-available">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
            <path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M16 12.5h2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M3 9h18" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </div>
        <div class="balance-figures">
          <div class="balance-value" id="wallet-available">0.00 ETB</div>
          <div class="balance-label" data-i18n="wallet.available_balance"></div>
        </div>
        <button type="button" id="wallet-status-toggle" class="balance-status-pill" aria-expanded="false">
          <span class="status-dot"></span>
          <span id="wallet-available-status"></span>
          <span class="status-chevron" aria-hidden="true">&#8250;</span>
        </button>
      </div>
      <div class="balance-secondary hidden" id="wallet-breakdown">
        <div class="balance-secondary-item">
          <div class="label" data-i18n="wallet.cash"></div>
          <div class="value" id="wallet-cash">0.00 ETB</div>
        </div>
        <div class="balance-secondary-item">
          <div class="label" data-i18n="wallet.bonus"></div>
          <div class="value" id="wallet-bonus">0.00 ETB</div>
        </div>
        <div class="balance-secondary-item">
          <div class="label" data-i18n="wallet.locked"></div>
          <div class="value" id="wallet-locked">0.00 ETB</div>
        </div>
      </div>
    </div>
    <div id="wallet-pane-deposit" class="wallet-pane hidden">
      <div id="deposit-automatic-section">
        <div class="amount-chips" id="deposit-amount-chips">
          <button type="button" class="amount-chip" data-amount="50">50</button>
          <button type="button" class="amount-chip" data-amount="100">100</button>
          <button type="button" class="amount-chip" data-amount="200">200</button>
          <button type="button" class="amount-chip" data-amount="500">500</button>
        </div>
        <input id="deposit-amount-input" class="wallet-input" type="number" inputmode="decimal" min="0" step="1" data-i18n-placeholder="wallet.amount_placeholder" />
        <button id="deposit-submit-btn" class="btn-primary" data-i18n="wallet.deposit_submit"></button>
        <p id="deposit-status" class="wallet-note"></p>
      </div>
      <!-- Shown first and styled as the primary action whenever telebirr_sms
           is available: it's the instant, no-review path, so a Telebirr
           payer should land here before "Manual deposit" (always-review,
           meant for the OTHER destinations in deposit-manual-destinations
           -- bank transfers etc. -- not a redundant second way to submit
           the exact same Telebirr payment). Ordered and styled this way
           after a real live incident where players defaulted to Manual
           for Telebirr payments purely because it was first and visually
           equal-weighted; see DECISIONS.md, 2026-09-14. -->
      <button type="button" id="deposit-telebirr-toggle-btn" class="btn-primary hidden" data-i18n="wallet.telebirr_deposit_toggle"></button>
      <button type="button" id="deposit-manual-toggle-btn" class="btn-secondary" data-i18n="wallet.manual_deposit_toggle"></button>

      <div id="deposit-manual-section" class="hidden">
        <p class="wallet-note" data-i18n="wallet.manual_deposit_intro"></p>
        <div id="deposit-manual-destinations"></div>
        <input id="deposit-manual-amount-input" class="wallet-input" type="number" inputmode="decimal" min="0" step="1" data-i18n-placeholder="wallet.amount_placeholder" />
        <input id="deposit-manual-reference-input" class="wallet-input" type="text" data-i18n-placeholder="wallet.manual_reference_placeholder" />
        <button id="deposit-manual-submit-btn" class="btn-primary" data-i18n="wallet.manual_deposit_submit"></button>
        <p id="deposit-manual-status" class="wallet-note"></p>
        <button type="button" id="deposit-automatic-toggle-btn" class="btn-secondary hidden" data-i18n="wallet.deposit_automatic_toggle"></button>
      </div>

      <!-- Telebirr SMS-evidence deposit: the player enters ONLY the
           transaction reference -- no amount field exists in this pane at
           all, so a client-chosen amount can never even be submitted (CTO
           directive section 140). The server determines the exact amount
           from the SMS evidence already on file. -->
      <div id="deposit-telebirr-section" class="hidden">
        <div id="deposit-telebirr-destination"><p class="wallet-note" data-i18n="wallet.telebirr_destination_loading"></p></div>
        <ol class="step-list">
          <li class="step-item"><span class="step-number">1</span><span class="step-text" data-i18n="wallet.telebirr_step1"></span></li>
          <li class="step-item"><span class="step-number">2</span><span class="step-text" data-i18n="wallet.telebirr_step2"></span></li>
          <li class="step-item"><span class="step-number">3</span><span class="step-text" data-i18n="wallet.telebirr_step3"></span></li>
        </ol>
        <input id="deposit-telebirr-reference-input" class="wallet-input" type="text" data-i18n-placeholder="wallet.telebirr_reference_placeholder" />
        <button id="deposit-telebirr-submit-btn" class="btn-primary" data-i18n="wallet.telebirr_deposit_submit"></button>
        <p id="deposit-telebirr-status" class="wallet-note"></p>
        <button type="button" id="deposit-telebirr-back-btn" class="btn-secondary" data-i18n="wallet.telebirr_deposit_back"></button>
      </div>
    </div>
    <div id="wallet-pane-withdraw" class="wallet-pane hidden">
      <input id="withdraw-amount-input" class="wallet-input" type="number" inputmode="decimal" min="0" step="1" data-i18n-placeholder="wallet.amount_placeholder" />
      <input id="withdraw-account-input" class="wallet-input" type="tel" inputmode="tel" data-i18n-placeholder="wallet.telebirr_placeholder" />
      <input id="withdraw-name-input" class="wallet-input" type="text" data-i18n-placeholder="wallet.holder_name_placeholder" />
      <label id="withdraw-manual-toggle-row" class="wallet-note" style="display:flex; align-items:center; gap:0.4rem;">
        <input type="checkbox" id="withdraw-manual-checkbox" />
        <span data-i18n="wallet.manual_withdraw_toggle"></span>
      </label>

      <div class="summary-card">
        <div class="summary-header">
          <span class="summary-title" data-i18n="wallet.summary_title"></span>
          <span class="status-pill" id="withdraw-summary-status" data-i18n="wallet.summary_not_submitted"></span>
        </div>
        <div class="summary-grid">
          <div>
            <div class="label" data-i18n="wallet.summary_amount"></div>
            <div class="value" id="withdraw-summary-amount">0 ETB</div>
          </div>
          <div>
            <div class="label" data-i18n="wallet.summary_account"></div>
            <div class="value" id="withdraw-summary-account" data-i18n="wallet.summary_not_provided"></div>
          </div>
          <div>
            <div class="label" data-i18n="wallet.summary_holder"></div>
            <div class="value" id="withdraw-summary-holder" data-i18n="wallet.summary_not_provided"></div>
          </div>
          <div>
            <div class="label" data-i18n="wallet.summary_processing_time"></div>
            <div class="value" data-i18n="wallet.summary_processing_time_value"></div>
          </div>
        </div>
      </div>

      <button id="withdraw-submit-btn" class="btn-primary" data-i18n="wallet.withdraw_submit"></button>
      <p id="withdraw-status" class="wallet-note"></p>
    </div>
    <div id="wallet-pane-history" class="wallet-pane hidden">
      <div class="amount-chips" id="history-filter-chips">
        <button type="button" class="amount-chip selected" data-filter="all" data-i18n="wallet.history_filter_all"></button>
        <button type="button" class="amount-chip" data-filter="won" data-i18n="wallet.history_filter_won"></button>
        <button type="button" class="amount-chip" data-filter="lost" data-i18n="wallet.history_filter_lost"></button>
      </div>
      <div id="history-list"></div>
    </div>
  </main>

  <!-- Keno: Game Center + board + picks + stake + PLAY + live draw reveal,
       all one screen -- there's no separate pre-round "lobby" the way
       Bingo has one, since a Keno round is always either open for bets or
       drawing; the current round's own status pill *is* the Game Center.
       Lazy-loaded: js/keno.js is only ever dynamically imported the first
       time open-keno-btn is pressed (spec 13: "Keno lazy-loaded separately
       from Bingo"), so its ~80-cell board and WS wiring cost nothing on
       every other screen. -->
  <main id="screen-keno" class="screen screen-keno" data-screen="keno">
    <div class="keno-topbar">
      <button id="keno-back-btn" class="keno-icon-btn" type="button" aria-label="back">‹</button>
      <div class="keno-header-title" data-i18n="keno.title"></div>
      <button id="keno-help-btn" class="keno-icon-btn" type="button" aria-label="help">?</button>
    </div>

    <div class="keno-status-row">
      <div id="keno-status-pill" class="keno-status-pill"></div>
      <div class="keno-jackpot-pill">
        <span data-i18n="keno.jackpot_label"></span>
        <span id="keno-jackpot-amount">0.00 ETB</span>
      </div>
    </div>

    <!-- Hero draw reveal -- hidden outside the drawing phase (toggled by
         keno.js's own keno.draw.started/keno.betting.open handlers). One
         big current-number ball, ringed like a real lottery draw, plus a
         growing trail of already-drawn balls underneath (own matches
         tinted gold) and a running "N / 20 drawn" progress label -- see
         DECISIONS.md/PROGRESS.md for why this replaced the old flat
         ball-strip-only reveal (a recorded reference platform's own Fast
         Keno draw screen). -->
    <div id="keno-hero-reveal" class="keno-hero-reveal hidden">
      <div id="keno-hero-ball" class="keno-hero-ball"></div>
      <div id="keno-draw-progress" class="keno-draw-progress"></div>
    </div>

    <div id="keno-board-wrap" class="keno-board-wrap">
      <div id="keno-board"></div>
      <!-- Shown only while no numbers are picked yet and betting is open
           -- a friendlier first touch than a blank board, gone the
           moment the first number is tapped. -->
      <div id="keno-empty-hint" class="keno-empty-hint hidden"></div>
    </div>

    <div id="keno-recent-draws" class="keno-recent-draws"></div>

    <div class="keno-quick-actions keno-quick-actions-4">
      <button id="keno-clear-btn" type="button" class="btn-secondary" data-i18n="keno.clear"></button>
      <button id="keno-lucky-btn" type="button" class="btn-secondary" data-i18n="keno.lucky_pick"></button>
      <button id="keno-repeat-btn" type="button" class="btn-secondary" data-i18n="keno.repeat"></button>
      <button id="keno-autoplay-btn" type="button" class="btn-secondary" data-i18n="keno.autoplay_button" disabled></button>
    </div>

    <!-- Live status while a session is running (packages/core/
         keno_autoplay.py) -- replaces the normal betting controls below
         rather than showing alongside them, since the board is locked to
         the session's own picks for its whole duration. -->
    <div id="keno-autoplay-status-bar" class="keno-autoplay-status-bar hidden">
      <div class="keno-autoplay-status-top">
        <span id="keno-autoplay-status-label" data-i18n="keno.autoplay_running_label"></span>
        <span id="keno-autoplay-status-rounds"></span>
      </div>
      <div class="keno-autoplay-status-bottom">
        <span>
          <span data-i18n="keno.autoplay_net_label"></span>
          <strong id="keno-autoplay-net-amount">0.00 ETB</strong>
        </span>
        <button id="keno-autoplay-stop-btn" type="button" class="btn-secondary" data-i18n="keno.autoplay_stop_button"></button>
      </div>
    </div>

    <div id="keno-betting-controls">
      <div class="keno-picks-row">
        <span id="keno-picks-count">0 / 10</span>
        <span id="keno-match-counter" class="keno-match-counter hidden"></span>
      </div>

      <div class="keno-stake-row">
        <span data-i18n="keno.stake_label"></span>
        <div id="keno-stake-chips" class="amount-chips"></div>
      </div>

      <div class="keno-payout-preview">
        <div class="keno-payout-preview-top">
          <span data-i18n="keno.potential_payout_label"></span>
          <span id="keno-payout-amount">0.00 ETB</span>
        </div>
        <!-- Live Match -> Pays rows for the current pick count -- filled by
             renderPicksAndPayout() in keno.js, empty/hidden until at least
             one number is picked. -->
        <div id="keno-match-pays-rows" class="keno-match-pays-rows hidden"></div>
      </div>

      <button id="keno-play-btn" type="button" class="btn-primary btn-gold" data-i18n="keno.play_button" disabled></button>
      <p id="keno-play-status" class="wallet-note"></p>
    </div>

    <!-- Autoplay setup (packages/core/keno_autoplay.py) -- opened from
         keno-autoplay-btn above, which requires picks+stake already
         selected exactly like a normal ticket (reuses that same
         selection, not a second picker). -->
    <div id="keno-autoplay-overlay" class="keno-overlay hidden">
      <div class="keno-overlay-card">
        <div class="keno-overlay-header">
          <span data-i18n="keno.autoplay_setup_title"></span>
          <button id="keno-autoplay-setup-close-btn" type="button" class="keno-icon-btn" aria-label="close">✕</button>
        </div>
        <p id="keno-autoplay-summary" class="keno-section-label"></p>

        <p class="keno-section-label" data-i18n="keno.autoplay_rounds_label"></p>
        <div id="keno-autoplay-rounds-chips" class="amount-chips"></div>

        <label class="keno-autoplay-stop-row">
          <input id="keno-autoplay-stop-win-toggle" type="checkbox" />
          <span data-i18n="keno.autoplay_stop_on_win_label"></span>
          <input id="keno-autoplay-stop-win-amount" type="number" inputmode="decimal" min="0" step="0.01"
                 data-i18n-placeholder="keno.autoplay_amount_placeholder" disabled />
        </label>
        <label class="keno-autoplay-stop-row">
          <input id="keno-autoplay-stop-loss-toggle" type="checkbox" />
          <span data-i18n="keno.autoplay_stop_on_loss_label"></span>
          <input id="keno-autoplay-stop-loss-amount" type="number" inputmode="decimal" min="0" step="0.01"
                 data-i18n-placeholder="keno.autoplay_amount_placeholder" disabled />
        </label>

        <p id="keno-autoplay-setup-status" class="wallet-note"></p>

        <div class="keno-overlay-actions">
          <button id="keno-autoplay-setup-cancel-btn" type="button" class="link-btn" data-i18n="keno.autoplay_cancel_button"></button>
          <button id="keno-autoplay-setup-start-btn" type="button" class="btn-primary btn-gold" data-i18n="keno.autoplay_start_button"></button>
        </div>
      </div>
    </div>

    <div id="keno-my-tickets-section" class="keno-my-tickets hidden">
      <p class="keno-section-label" data-i18n="keno.my_tickets_label"></p>
      <div id="keno-my-tickets-list"></div>
    </div>

    <div class="keno-footer-links">
      <button id="keno-paytable-btn" type="button" class="link-btn" data-i18n="keno.view_paytable"></button>
      <button id="keno-history-btn" type="button" class="link-btn" data-i18n="keno.view_history"></button>
    </div>

    <!-- Zero-knowledge onboarding (spec 13): shown once per device
         (localStorage-gated by keno.js), three sentences + three simple
         pictures. "How to play" (keno-help-btn above) reopens this same
         overlay on demand, any time. -->
    <div id="keno-onboarding-overlay" class="keno-overlay hidden">
      <div class="keno-overlay-card">
        <div id="keno-onboard-steps" class="keno-onboard-steps"></div>
        <div id="keno-onboard-dots" class="keno-onboard-dots"></div>
        <div class="keno-overlay-actions">
          <button id="keno-onboard-skip-btn" type="button" class="link-btn" data-i18n="keno.onboard_skip"></button>
          <button id="keno-onboard-next-btn" type="button" class="btn-primary" data-i18n="keno.onboard_next"></button>
        </div>
      </div>
    </div>

    <!-- Paytable, always reachable in-app (spec 13) -->
    <div id="keno-paytable-overlay" class="keno-overlay hidden">
      <div class="keno-overlay-card">
        <div class="keno-overlay-header">
          <span data-i18n="keno.paytable_title"></span>
          <button id="keno-paytable-close-btn" type="button" class="keno-icon-btn" aria-label="close">✕</button>
        </div>
        <div id="keno-paytable-picks-tabs" class="amount-chips"></div>
        <div id="keno-paytable-rows" class="keno-paytable-rows"></div>
      </div>
    </div>
  </main>

  <!-- Keno result: WIN / LOSE, matching #screen-result's own shape and
       reusing its confetti/fairness-panel CSS classes verbatim (see
       css/keno.css). A distinct screen from #screen-result, not a shared
       one -- Bingo's result carries winner-pill/card-preview concepts
       that don't apply to a Keno ticket at all. -->
  <main id="screen-keno-result" class="screen result-screen" data-screen="keno-result">
    <div id="keno-result-confetti" class="result-confetti" aria-hidden="true"></div>
    <div id="keno-result-title" class="result-title"></div>
    <div id="keno-result-amount" class="result-amount"></div>
    <div id="keno-result-meta" class="result-meta"></div>
    <div class="result-actions">
      <button id="keno-play-again-btn" class="btn-primary btn-gold" data-i18n="keno.play_again"></button>
      <button id="keno-result-verify-btn" class="btn-secondary" data-i18n="result.verify_draw"></button>
    </div>
    <div id="keno-fairness-panel" class="fairness-panel hidden">
      <div class="fairness-row">
        <span data-i18n="fairness.verified_label"></span>
        <span id="keno-fairness-verified"></span>
      </div>
      <div class="fairness-row">
        <span data-i18n="fairness.seed_hash_label"></span>
        <span id="keno-fairness-hash" class="fairness-value"></span>
      </div>
      <div class="fairness-row">
        <span data-i18n="fairness.seed_label"></span>
        <span id="keno-fairness-seed" class="fairness-value"></span>
      </div>
      <p class="wallet-note" data-i18n="fairness.explainer"></p>
      <button id="keno-fairness-close-btn" class="btn-secondary" data-i18n="fairness.close"></button>
    </div>
  </main>

  <!-- Keno history/stats: its own keno-history-tab* classes, deliberately
       NOT wallet.css's own .wallet-tab -- app.v6.js wires a real, global
       `document.querySelectorAll(".wallet-tab")` click handler
       (switchToWalletTab()) with no #screen-wallet scoping, so reusing
       that exact class name here made Bingo's own handler double-fire on
       these elements too and crash reaching for a #wallet-pane-* id that
       was never going to exist for a Keno tab -- a real bug this
       session's own e2e test caught. The visual styling (see keno.css)
       is copied from .wallet-tabs/.wallet-tab rather than shared, since
       app.v6.js's selector means that class name isn't safely reusable
       as-is. -->
  <main id="screen-keno-history" class="screen" data-screen="keno-history">
    <div class="wallet-header">
      <h2 data-i18n="keno.history_title"></h2>
      <button id="keno-history-back-btn" type="button">✕</button>
    </div>
    <div class="keno-history-tabs">
      <div class="keno-history-tab active" data-tab="rounds" data-i18n="keno.tab_rounds"></div>
      <div class="keno-history-tab" data-tab="tickets" data-i18n="keno.tab_my_tickets"></div>
      <div class="keno-history-tab" data-tab="stats" data-i18n="keno.tab_stats"></div>
      <div class="keno-history-tab" data-tab="hotcold" data-i18n="keno.tab_hot_cold"></div>
    </div>
    <div id="keno-history-pane-rounds" class="keno-history-pane">
      <div id="keno-history-rounds-list"></div>
    </div>
    <div id="keno-history-pane-tickets" class="keno-history-pane hidden">
      <div id="keno-history-tickets-list"></div>
    </div>
    <div id="keno-history-pane-stats" class="keno-history-pane hidden">
      <div id="keno-history-stats-grid" class="keno-stats-grid"></div>
    </div>
    <div id="keno-history-pane-hotcold" class="keno-history-pane hidden">
      <div class="keno-hotcold-row">
        <div>
          <p class="keno-section-label" data-i18n="keno.hottest_label"></p>
          <div id="keno-hottest-numbers" class="keno-number-chip-row"></div>
        </div>
        <div>
          <p class="keno-section-label" data-i18n="keno.coldest_label"></p>
          <div id="keno-coldest-numbers" class="keno-number-chip-row"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/app.v6.js"></script>
</body>
</html>
