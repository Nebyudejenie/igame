<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zemen Game Admin</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div id="toast" class="toast"></div>

  <div id="login-screen"></div>

  <div id="app-shell" hidden>
    <nav id="nav"></nav>
    <main id="content"></main>
  </div>

  <div id="global-search-overlay" class="search-overlay" hidden>
    <div class="search-panel">
      <input type="text" id="global-search-input" placeholder="Search users, rooms, payments, commands… (Esc to close)" autocomplete="off" />
      <div id="global-search-results"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
