name: jobingo

services:
  postgres:
    image: postgres:15
    # Explicit, host-wide-unique name -- see DECISIONS.md's 2026-09-02
    # entry: on the real production host this stack was found running on,
    # gateway/payments/admin are dual-homed onto a second, shared Docker
    # network (Traefik ingress for other apps on the same box), which also
    # has its own container aliased plainly "postgres". Docker's embedded
    # DNS resolved the bare service name ambiguously across both networks
    # and silently pointed jobingo's own services at the wrong database
    # for ~19.5 hours. A `container_name` is unique across the whole
    # Docker host (Docker enforces this at creation time), so every other
    # service's DATABASE_URL points at `jobingo-postgres` specifically,
    # never the bare `postgres` service name -- this can't regress back
    # into the same ambiguity even if this stack ever gets a network
    # neighbor again.
    container_name: jobingo-postgres
    environment:
      POSTGRES_USER: jobingo
      POSTGRES_PASSWORD: jobingo
      POSTGRES_DB: jobingo
    ports:
      # Host 5433, not 5432 -- this machine already runs another project's
      # Postgres on the default port.
      - "5433:5432"
    volumes:
      - jobingo_postgres_data:/var/lib/postgresql/data
      # WAL archive destination for spec section 9.2's PITR requirement
      # (idea.md ~line 6161) -- host-visible, nested under the same
      # already-gitignored backups/ root deploy/backup.sh writes dumps
      # into, so deploy/basebackup.sh and deploy/restore_pitr.sh can read
      # it directly without going through `docker compose exec`. See
      # DECISIONS.md.
      - ../backups/wal_archive:/wal_archive
      # DEV ONLY -- see that file's own header. Runs once, only against a
      # genuinely fresh data directory; deliberately not present in
      # docker-compose.prod.yml at all.
      - ./postgres-dev-init:/docker-entrypoint-initdb.d
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      # Postgres's own documented archive_command idiom (refuses to
      # silently overwrite an already-archived segment -- nonzero exit ->
      # Postgres logs a warning and retries, the correct, intentional
      # behavior on a real conflict), adapted with `install -m 644` in
      # place of a plain `cp`: WAL segments are created 0600 by the
      # postgres process inside this container, but deploy/restore_pitr.sh
      # deliberately reads them from a SEPARATE throwaway container running
      # as the host user (never as this container's own uid) -- `install`
      # sets the readable mode atomically as part of the same copy, so
      # there's no separate chmod step that could succeed only halfway
      # (leaving a file that's genuinely archived but permanently
      # misreported as failed, since a later retry's `test ! -f` would
      # then see it as already present and skip re-archiving).
      - "-c"
      - "archive_command=test ! -f /wal_archive/%f && install -m 644 %p /wal_archive/%f"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobingo -d jobingo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    # Same reasoning as postgres's own container_name above -- a unique,
    # host-wide name that every other service's REDIS_URL points at
    # directly (`jobingo-redis`), immune to the same cross-network bare-
    # name ambiguity.
    container_name: jobingo-redis
    ports:
      # Host 6380, not 6379 -- same reason as Postgres above.
      - "6380:6379"
    volumes:
      - jobingo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: real metrics scraping (spec section 10.4), against services
  # run directly on the host (see deploy/prometheus/prometheus.yml for why
  # -- this stack only runs Postgres/Redis as long-lived containers).
  # Start with `docker compose -f deploy/docker-compose.yml up -d prometheus`.
  prometheus:
    image: prom/prometheus:v2.55.1
    # Gated behind a profile so a plain `docker compose up -d` (used
    # throughout this README, and by every clean-slate rebuild this
    # session runs) doesn't start a third container nobody asked for.
    # `docker compose up -d prometheus` still starts it directly --
    # explicitly naming a profiled service on the command line overrides
    # profile filtering in Compose.
    profiles: ["observability"]
    ports:
      # Host 9091, not the default 9090 -- same reasoning as Postgres/Redis
      # above.
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      # Lets the container reach services run directly on this host (e.g.
      # `uvicorn services.gateway.app:app --port 8000`) via a stable name,
      # the way it would reach a real deployment's actual service replicas
      # in production -- Docker's own bridge network gives the container no
      # route to host-bound ports otherwise.
      - "host.docker.internal:host-gateway"

  # Optional: lets packages/core/reconcile_job.py (a one-shot CLI job, not
  # a scraped long-running process) push its result somewhere Prometheus
  # can alert on -- see PUSHGATEWAY_URL in .env.example. Also profile-gated;
  # start with `docker compose -f deploy/docker-compose.yml up -d pushgateway`.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    profiles: ["observability"]
    ports:
      # Host 9092 -- next free slot after Prometheus's own 9091 above.
      - "9092:9091"

  # Optional: dashboards over the same real metrics (spec section 10.4
  # pairs "Prometheus + Grafana" as one bullet). Datasource and dashboard
  # are both provisioned from files under deploy/grafana/ -- version
  # controlled, not built by hand in the UI and forgotten. Also
  # profile-gated; start with
  # `docker compose -f deploy/docker-compose.yml up -d grafana` (brings up
  # prometheus too, via depends_on, since an unprovisioned datasource
  # would make every panel show "no data").
  grafana:
    image: grafana/grafana-oss:11.3.1
    profiles: ["observability"]
    depends_on:
      - prometheus
    ports:
      # Host 3001, not Grafana's default 3000 -- same reasoning as every
      # other port in this file: avoid clashing with another project.
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "jobingo"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

  # Optional: real OTLP trace collection + UI (spec section 10.4: "deposit
  # and payout paths end to end"). All-in-one image -- OTLP/HTTP receiver,
  # storage, and query UI in one container, the simplest real thing to
  # point OTEL_EXPORTER_ENDPOINT at for local dev. Also profile-gated;
  # start with `docker compose -f deploy/docker-compose.yml up -d jaeger`.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # UI + query API.
      - "16686:16686"
      # OTLP/HTTP receiver -- set OTEL_EXPORTER_ENDPOINT=http://localhost:4318
      - "4318:4318"

volumes:
  jobingo_postgres_data:
  jobingo_redis_data:
