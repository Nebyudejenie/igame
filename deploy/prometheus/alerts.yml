# Alert rules, verbatim from spec section 10.4: "balance reconciliation
# mismatch (page immediately), payout queue depth > 50, deposit success
# rate < 90%, p99 call latency > 1 s, any round voided."
#
# No Slack/PagerDuty/email receiver is wired up here -- that's a real
# credential this session doesn't have, the same reasoning
# SantimPay/ArifPay were left unbuilt (see DECISIONS.md). What's real and
# verified is that these rules are syntactically valid and actually load
# into a running Prometheus (`promtool check rules` / a real container
# refusing to start on bad YAML), and that they evaluate against the real
# metric names packages/core/metrics.py defines -- an operator only needs
# to point Alertmanager's receivers at real endpoints to get paged.

groups:
  - name: jo-bingo
    rules:
      - alert: LedgerReconciliationMismatch
        # reconcile_job.py (packages/core/reconcile_job.py) is a one-shot
        # CLI job with no long-running /metrics endpoint of its own, so it
        # pushes this metric to a Prometheus Pushgateway after each run
        # instead (job="reconcile_job") -- confirmed wired end to end, see
        # DECISIONS.md 2026-08-24. Scheduling reconcile_job.py itself
        # (cron/systemd-timer/k8s CronJob) remains a real deployment-time
        # decision, same as every other worker entrypoint in this codebase.
        expr: ledger_reconciliation_mismatch_count > 0
        labels:
          severity: page
        annotations:
          summary: "Ledger reconciliation found a cached-balance / ledger-entries mismatch"

      - alert: LedgerReconciliationSweepMismatch
        # payout_worker.py now also runs services.payments
        # .ledger_reconcile_sweep.sweep_ledger_reconciliation() hourly (a
        # real, wired periodic sweep on that already-running process, the
        # same pattern as PaymentReconciliationMismatch below) -- so unlike
        # the pushed metric above, this fires from a real, live-scraped
        # gauge with no external scheduler required at all.
        expr: ledger_reconciliation_sweep_mismatch_count > 0
        labels:
          severity: page
        annotations:
          summary: "Ledger reconciliation sweep found a cached-balance / ledger-entries mismatch"

      - alert: PaymentReconciliationMismatch
        # payout_worker.py runs services.payments.deposits
        # .run_provider_reconciliation() hourly (a real, wired periodic
        # sweep on that already-running process -- see DECISIONS.md), so
        # this fires from a real, live-scraped gauge, not a pushed one.
        expr: payment_reconciliation_mismatch_count > 0
        labels:
          severity: page
        annotations:
          summary: "A deposit's provider status/amount disagreed with our own records on the last reconciliation pass"

      - alert: PayoutQueueDepthHigh
        expr: payout_queue_depth > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Payout queue depth is {{ $value }}, above the 50 budget"

      - alert: DepositSuccessRateLow
        expr: >
          sum(rate(deposit_outcomes_total{outcome="credited"}[15m]))
          /
          sum(rate(deposit_outcomes_total[15m]))
          < 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deposit success rate below 90% over the last 15 minutes"

      - alert: CallAckLatencyP99High
        expr: >
          histogram_quantile(0.99, sum(rate(gateway_command_ack_seconds_bucket[5m])) by (le))
          > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p99 gateway command-to-ack latency above 1s over the last 5 minutes"

      - alert: RoundVoided
        expr: increase(engine_rounds_voided_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A round was voided and refunded in the last 5 minutes"

      # CTO directive section 107: "payment ingestion stopped, parser
      # failure spike, ... reconciliation mismatch" for the Telebirr
      # SMS-evidence rail. Deliberately NOT implementing "ingestion
      # stopped" as a naive rate()==0 alert: that would page constantly
      # in the feature's own shipped-disabled-by-default state, which is
      # not an anomaly -- the same "don't fabricate an alert that doesn't
      # evaluate meaningfully yet" restraint this file's own header
      # already applies to unwired notification receivers. A real
      # "stopped" alert needs a signal for "the feature is enabled and
      # has established real volume" first; add it once that exists.
      - alert: TelebirrEvidenceReconciliationMismatch
        # services/payments/payout_worker.py runs telebirr_reconcile.py's
        # run_telebirr_reconciliation() hourly, the same real periodic
        # sweep run_provider_reconciliation() already runs on.
        expr: telebirr_evidence_reconciliation_mismatch_count > 0
        labels:
          severity: page
        annotations:
          summary: "A Telebirr payments row's linked evidence count is not exactly 1 -- possible no-source or double-credit"

      - alert: TelebirrParserFailureSpike
        expr: increase(telebirr_parser_failures_total[15m]) > 5
        labels:
          severity: warning
        annotations:
          summary: "More than 5 Telebirr SMS messages failed to parse in the last 15 minutes -- possible format change or spam"

      # Part 7 audit gap (DECISIONS.md, 2026-09-21): "no liability-near
      # -cash alert, no exposure>80% alert." Both gauges themselves were
      # also dead until this same pass (packages/core/keno_tickets.py and
      # services/engine/keno_round_engine.py now .set() them for real --
      # see those files' own comments).
      - alert: KenoRoundExposureHigh
        # ceiling = reserve_balance * max_round_exposure_pct (packages/
        # core/keno_exposure.py) -- this round's own projected 99.9th
        # -percentile payout is approaching what the reserve is actually
        # allowed to risk on it. The literal "exposure>80%" threshold the
        # audit named.
        expr: keno_round_exposure_ratio > 0.8
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Current Keno round's projected exposure is above 80% of its ceiling"

      - alert: KenoReserveDepleted
        # keno_reserve is a dedicated pot (services/admin/keno_queries.py
        # ::dashboard_summary_admin()'s own comment: deliberately kept
        # structurally separate from player_liability, "conflating them
        # is how operators misjudge solvency") -- <= 0 is the one
        # threshold on it defensible without a real operator decision: the
        # reserve can no longer fund a payout at all. A more sensitive
        # early-warning ratio (e.g. against player_liability or a target
        # float) needs that decision first, same restraint this file's
        # own TelebirrEvidenceReconciliation comment already applies to
        # an alert it deliberately left unimplemented pending a real
        # signal -- don't fabricate a threshold with false precision.
        expr: keno_reserve_balance <= 0
        labels:
          severity: page
        annotations:
          summary: "Keno reserve balance has hit zero or gone negative -- cannot fund payouts"

      - alert: KenoRoundStuck
        # 08-runbook.md's own documented gap, closed 2026-09-24:
        # "detection today is manual -- no configured alert for a
        # genuinely stuck round." keno_oldest_nonterminal_round_age_
        # seconds (services/engine/keno_round_engine.py's own
        # _update_oldest_nonterminal_round_gauge(), set once per round
        # cycle from a real DB read) is 0 whenever nothing is stuck. The
        # threshold reuses STUCK_ROUND_THRESHOLD_SECONDS (300) verbatim
        # -- the exact same real constant recover_on_startup() already
        # uses to decide "resume" vs. "fail+refund" -- rather than
        # inventing a second, different number for the same concern.
        expr: keno_oldest_nonterminal_round_age_seconds > 300
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "A Keno round has been non-terminal for over 5 minutes -- see 08-runbook.md's stuck-round scenario"

      - alert: KenoEngineHeartbeatMissing
        # The other half of the same runbook gap: "no configured alert
        # for... a missing engine heartbeat." keno_rounds_created_total
        # increments every real round cycle (~round_cycle_seconds, 45s
        # at launch) regardless of keno_enabled -- the engine creates
        # and cycles rounds whether or not ticket placement is currently
        # allowed, confirmed directly against production 2026-09-23 (8
        # real rounds created within minutes of a fresh deploy, well
        # before keno_enabled was ever considered). 5 minutes is ~6-7x
        # that cycle length -- comfortable margin against ordinary
        # jitter (a slow settlement pass, a brief Redis blip the lock
        # rides out) without waiting so long that a genuinely dead
        # engine goes unnoticed for an unreasonable stretch.
        expr: increase(keno_rounds_created_total[5m]) == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "No new Keno round created in 5 minutes -- keno-worker may be down or wedged"
