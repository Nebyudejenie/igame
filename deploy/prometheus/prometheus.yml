# Real scrape config for the Jo Bingo services (spec section 10.4). Each
# service is its own process with its own /metrics endpoint -- see
# packages/core/metrics.py for what's actually instrumented and why.
#
# This dev/test stack doesn't run gateway/admin/payments/bot as long-lived
# docker-compose services (only Postgres and Redis are -- see the top-level
# docker-compose.yml comment on why); an operator runs them directly, e.g.
# `uvicorn services.gateway.app:app --port 8000`. host.docker.internal
# (wired up via extra_hosts in docker-compose.yml) is how the Prometheus
# container reaches those host-run processes. A real production deployment
# would instead point these targets at each service's actual replicas
# (or use service discovery) -- these ports are this dev stack's own
# convention, documented in README.md, not a spec requirement.

global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: admin
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: payments
    static_configs:
      - targets: ["host.docker.internal:8002"]

  - job_name: bot
    static_configs:
      - targets: ["host.docker.internal:8003"]

  - job_name: engine-worker
    static_configs:
      - targets: ["host.docker.internal:8004"]

  - job_name: payout-worker
    static_configs:
      - targets: ["host.docker.internal:8005"]

  - job_name: keno-worker
    static_configs:
      - targets: ["host.docker.internal:8008"]

  - job_name: pushgateway
    # honor_labels: a pushed job's own "job"/"instance" labels (e.g.
    # reconcile_job.py's job="reconcile_job") should win over this scrape
    # job's -- otherwise every batch job pushed here would misleadingly
    # show up labeled job="pushgateway" instead of by its own name.
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
