name: jobingo-prod

# Production stack: Postgres + Redis, a one-shot migration job, all six
# deployable units (Dockerfile builds one shared image; each service below
# just picks its own command against it), and cloudflared -- run by the
# self-hosted GitHub Actions runner on the Proxmox server this deploys to
# (see .github/workflows/cd.yml), not by a developer's own machine the way
# deploy/docker-compose.yml is.
#
# This server has no public IP of its own -- cloudflared is the only
# ingress path in, tunnelling app./admin./pay./bot.arada.fun to the
# gateway/admin/payments/bot containers by their plain Compose service
# name (see deploy/cloudflared/config.yml.example and README.md's "Domain
# and Cloudflare Tunnel" section for the one-time setup). engine-worker/
# payout-worker are never tunnelled -- their /metrics ports are for
# internal Prometheus scraping only, not public traffic.
#
# Needs a real .env file next to this one (never committed -- see
# .env.prod.example for every variable this reads, and README.md's
# "CI/CD" section for how the CD workflow gets it onto the server). POSTGRES_
# PASSWORD has no default on purpose: an empty default here would be a
# real, silent security hole in a file whose whole purpose is production.
#
# JOBINGO_IMAGE is set by the CD workflow to the exact tag it just built
# and pushed (see cd.yml) -- defaulting to :latest here only so this file
# is still directly runnable by hand (`docker compose -f deploy/docker
# -compose.prod.yml up -d`) against whatever was last pulled.

x-app-env: &app-env
  env_file: .env
  # jobingo-postgres/jobingo-redis, never the bare postgres/redis: an
  # `environment:` key here always wins over the same key in `.env`
  # (env_file: is only a fallback default), so hardcoding the real
  # production host's own container_name aliases directly here is what
  # actually closes DECISIONS.md's 2026-09-02 incident for good -- on
  # that host, gateway/payments/admin/bot are dual-homed onto a second,
  # shared Docker network for Traefik ingress, which has its own
  # container aliased plainly "postgres"/"redis" (an unrelated app's).
  # Docker's embedded DNS resolved the bare service name ambiguously
  # across both networks and silently pointed these services at the
  # wrong database for ~19.5 hours before that was caught. Whatever this
  # exact string said before that incident is irrelevant now -- even a
  # correctly-fixed `.env` on disk can never override this line, which is
  # the point: the fix is no longer something a hand-maintained,
  # gitignored secrets file has to remember to get right.
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-jobingo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@jobingo-postgres:5432/${POSTGRES_DB:-jobingo}
    DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-jobingo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@jobingo-postgres:5432/${POSTGRES_DB:-jobingo}
    REDIS_URL: redis://jobingo-redis:6379/0

x-app-depends-on: &app-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    # Host-wide-unique name, same reasoning as deploy/docker-compose.yml's
    # own container_name -- see DECISIONS.md's 2026-09-02 entry and that
    # file's comment. x-app-env above should point every service's
    # DATABASE_URL at `jobingo-postgres` specifically, never bare
    # `postgres`, on any host where this stack shares a Docker network
    # with unrelated containers.
    container_name: jobingo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobingo}
    volumes:
      - jobingo_prod_postgres_data:/var/lib/postgresql/data
      # Same WAL archiving as deploy/docker-compose.yml -- see that file's
      # own comment and DECISIONS.md. Relative to this file's own
      # directory (deploy/), same as the dev compose file.
      - ../backups/wal_archive:/wal_archive
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      # See deploy/docker-compose.yml's own comment for why `install -m
      # 644` replaces a plain `cp` here.
      - "-c"
      - "archive_command=test ! -f /wal_archive/%f && install -m 644 %p /wal_archive/%f"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jobingo} -d $${POSTGRES_DB:-jobingo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    container_name: jobingo-redis
    volumes:
      - jobingo_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies every pending migration, then exits 0. Every real
  # service below waits on this exiting successfully (service_completed_
  # successfully), not just on Postgres being reachable -- so a fresh
  # deploy never races app code against a schema it doesn't match yet.
  migrate:
    image: ${JOBINGO_IMAGE:-jobingo:latest}
    restart: "no"
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "-c", "migrations/alembic.ini", "upgrade", "head"]

  gateway:
    image: ${JOBINGO_IMAGE:-jobingo:latest}
    restart: unless-stopped
    <<: *app-env
    depends_on: *app-depends-on
    ports:
      - "8000:8000"
    command: ["uvicorn", "services.gateway.app:app", "--host", "0.0.0.0", "--port", "8000"]

  admin:
    image: ${JOBINGO_IMAGE:-jobingo:latest}
    restart: unless-stopped
    <<: *app-env
    depends_on: *app-depends-on
    ports:
      - "8001:8001"
    command: ["uvicorn", "services.admin.app:app", "--host", "0.0.0.0", "--port", "8001"]

  payments:
    image: ${JOBINGO_IMAGE:-jobingo:latest}
    restart: unless-stopped
    <<: *app-env
    depends_on: *app-depends-on
    ports:
      - "8002:8002"
    command: ["uvicorn", "services.payments.app:app", "--host", "0.0.0.0", "--port", "8002"]

  bot:
    image: ${JOBINGO_IMAGE:-jobingo:latest}
    restart: unless-stopped
    <<: *app-env
    depends_on: *app-depends-on
    ports:
      - "8003:8003"
    command: ["python", "-m", "services.bot.app"]

  # Enterprise SMS Control Plane (DECISIONS.md, 2026-09-07) -- a
  # genuinely separate product from Bingo, its own sms.arada.fun
  # subdomain, sharing this same image and the admin_users/RBAC/audit
  # tables the way every service here shares the database, but no other
  # runtime dependency on gateway/bot/payments.
  sms:
    image: ${JOBINGO_IMAGE:-jobingo:latest}
    restart: unless-stopped
    <<: *app-env
    depends_on: *app-depends-on
    ports:
      - "8006:8006"
    command: ["uvicorn", "services.sms.app:app", "--host", "0.0.0.0", "--port", "8006"]

  engine-worker:
    image: ${JOBINGO_IMAGE:-jobingo:latest}
    restart: unless-stopped
    <<: *app-env
    depends_on: *app-depends-on
    ports:
      - "8004:8004"
    command: ["python", "-m", "services.engine.worker"]

  payout-worker:
    image: ${JOBINGO_IMAGE:-jobingo:latest}
    restart: unless-stopped
    <<: *app-env
    depends_on: *app-depends-on
    ports:
      - "8005:8005"
    command: ["python", "-m", "services.payments.payout_worker"]

  # Admin-controlled bot accounts (services/admin/simulated_players_
  # queries.py) that join real rooms and play through the real engine so
  # rooms don't feel empty during early launch -- see that module's own
  # docstring for the financial-isolation design. A separate process for
  # the same reason engine-worker/payout-worker are: a crash here can
  # never touch a real room's own engine or the ledger. Every runtime
  # toggle (the global enabled switch, each bot's status/strategy) is a
  # polled DB column, not an env var, so nothing here needs its own
  # config beyond the shared DATABASE_URL/REDIS_URL -- and the system
  # ships and stays disabled until an admin explicitly turns it on from
  # the Simulated Players console screen, regardless of this container
  # running.
  simulated-players-worker:
    image: ${JOBINGO_IMAGE:-jobingo:latest}
    restart: unless-stopped
    <<: *app-env
    depends_on: *app-depends-on
    ports:
      - "8007:8007"
    command: ["python", "-m", "services.engine.simulated_players_worker"]

  # One-shot, same shape as migrate above -- spec section 14's definition
  # of done needs this "verified nightly", but nothing runs it on a
  # schedule yet. profiles: ["reconcile"] (the same gating
  # deploy/docker-compose.yml already uses for pushgateway/grafana) keeps
  # it out of a plain `up -d`, so it never accidentally runs once per
  # deploy the way migrate correctly does -- `docker compose run` ignores
  # profile restrictions, so cron/systemd-timer/k8s CronJob can all still
  # invoke it directly: `docker compose -f docker-compose.prod.yml run
  # --rm reconcile-job`. See README.md's "Nightly ledger reconciliation"
  # section for why the actual schedule (a crontab line, a systemd timer)
  # is left as a deploy-time step rather than committed here: the runner
  # checkout's real path on the server is only known once someone
  # actually registers it (README.md's own CD setup notes make the same
  # call for the runner registration step itself).
  reconcile-job:
    image: ${JOBINGO_IMAGE:-jobingo:latest}
    restart: "no"
    profiles: ["reconcile"]
    <<: *app-env
    depends_on: *app-depends-on
    command: ["python", "-m", "packages.core.reconcile_job"]

  # STALE, per docs/PRODUCTION_DOMAIN_AND_CLOUDFLARE.md (2026-09-05,
  # re-confirmed after a real routing outage on 2026-09-14, see
  # DECISIONS.md): production does NOT run cloudflared as a container.
  # It runs as a host-level systemd service, forwarding into a separate
  # Traefik instance (a different, shared stack on the same host, not
  # tracked in this repository) that does the real per-hostname routing.
  # This service definition is not what's actually deployed -- don't
  # assume `docker compose ... restart cloudflared` or editing
  # ./cloudflared/config.yml does anything to real production traffic.
  # Kept only for a possible future containerized-cloudflared migration;
  # see deploy/cloudflared/config.yml.example's own header before
  # touching this. Routing rules would live in config.yml (see
  # deploy/cloudflared/config.yml.example), never in the Cloudflare
  # dashboard -- both files, and the tunnel's own credentials, are real
  # secrets and deliberately gitignored like deploy/.env; README.md's
  # "Domain and Cloudflare Tunnel" section has the one-time setup that
  # creates them.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/tunnel-credentials.json:/etc/cloudflared/tunnel-credentials.json:ro
    depends_on:
      - gateway
      - admin
      - payments
      - bot
      - sms

volumes:
  jobingo_prod_postgres_data:
  jobingo_prod_redis_data:
