[project]
name = "jobingo"
version = "0.1.0"
description = "Arada Bingo -- real-money multiplayer bingo on Telegram"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "redis>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "bcrypt>=4.1",
    "pyotp>=2.9",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "cryptography>=43",
    "tzdata>=2024.1",
    # aiogram 3, per the spec's own stated stack -- was installed in every
    # dev environment this whole project has been built in, but never
    # actually declared here; a real `pip install .` (this Dockerfile's
    # own install step, notably) silently had no bot at all until this
    # was caught. aiohttp is aiogram's own transport, imported directly
    # by services/bot/app.py too (`from aiohttp import web`), so it's
    # listed explicitly rather than left to ride in as an undeclared
    # transitive dependency. httpx moved here from the dev-only extra
    # below -- it's services/payments/chapa.py's real HTTP client, not a
    # test-only tool.
    "aiogram>=3.0",
    "aiohttp>=3.9",
    "httpx>=0.27",
    # FastAPI's own Form(...)/UploadFile support (services/sms/app.py's
    # CSV bulk-import route, packages/core/sms/csv_import.py) needs this
    # at import time -- fastapi raises RuntimeError otherwise, so it's a
    # hard dependency, not an optional extra. Same failure class as the
    # aiogram gap above: present in every dev shell this project has ever
    # been built in (by chance, not by declaration), so every test here
    # passed while a genuinely fresh `pip install .` -- the production
    # image's own build step -- silently produced an sms service that
    # crash-loops on startup. Confirmed 2026-09-14: the sms service had
    # never actually been deployed to production before, so this sat
    # undetected since the CSV import feature shipped (2026-09-10) until
    # the first real deploy attempt hit it.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "asyncpg-stubs>=0.29",
    "websockets>=12.0",
    "playwright>=1.40",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-m 'not load and not e2e and not chaos_infra and not keno_statistical'"
markers = [
    "load: real-scale measurement tests (hundreds+ of concurrent sockets), excluded from the default run because their absolute latency numbers are sensitive to whatever else is sharing this process/CPU -- run standalone with `pytest -m load` for a clean reading, same reason real load tests run as their own dedicated process rather than interleaved with the correctness suite.",
    "e2e: real-browser tests (Playwright/Chromium), excluded from the default run because they need a Chromium binary most dev setups won't have installed -- run explicitly with `pytest -m e2e` after `playwright install chromium`.",
    "chaos_infra: restarts a real docker-compose service (Redis/Postgres) mid-test -- excluded even from `-m load` batch runs because it breaks every session-scoped fixture built on that service for the rest of the pytest process, not just its own test. Always run alone: `pytest -m chaos_infra`.",
    "keno_statistical: large-N (>=1,000,000 draws/tickets) statistical convergence tests for the Keno RNG and paytable (spec Part 17) -- excluded from the default run purely because of wall-clock cost (tens of seconds to minutes), not flakiness. Run explicitly with `pytest -m keno_statistical -v -s`.",
]

[tool.mypy]
strict = true
files = ["packages", "services", "migrations"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["packages*", "services*"]
